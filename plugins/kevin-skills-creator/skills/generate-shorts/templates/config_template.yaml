# generate-shorts 설정 파일
# config.yaml 또는 config.json으로 저장하여 generate_shorts.py --config 옵션으로 전달
# (여기 있는 키만 실제로 코드가 읽는다 — 아래 "참고" 주석의 항목은 CLI/환경변수로 제어)

# 영상 설정
width: 1080                    # 쇼츠 가로 해상도
height: 1920                   # 쇼츠 세로 해상도

# 세로 변환 레이아웃 (16:9 -> 9:16)
#   fit_blur : 원본 전체 + 블러 배경, 잘림 없음 (기본, 화면녹화/코드/강의/게임 권장)
#   crop     : 가운데만 채우고 좌우 잘림 (인물 중앙 토킹헤드 전용)
#   fit      : 단색 레터박스
layout: "fit_blur"
bg_blur_radius: 20             # fit_blur 배경 블러 강도

# 자막 스타일 (자막은 PlayRes 1080x1920 ASS로 생성 -> 폰트 크기가 실제 픽셀 값)
subtitle_font_size: 54         # 자막 폰트 크기(px @1920). 너무 작/크면 여기서 조정
subtitle_border_width: 3       # 자막 박스 테두리 두께
subtitle_margin_v: 150         # 자막 하단 여백(px)

# 후크 오버레이 (본편 첫 부분 위에 큰 텍스트 — 검은 카드보다 이탈이 적음)
hook_overlay: true             # 후크 텍스트 오버레이 사용
hook_duration: 2.5             # 후크 표시 시간(초)
hook_font_size: 64             # 후크 폰트 크기(px)

# 인트로/아웃트로 카드 (검은 정지 화면 카드 — 시청 이탈 유발, 기본 꺼짐)
intro_card: false              # true면 검은 배경 제목 카드를 앞에 붙임
outro_enabled: false           # true면 아웃트로 카드를 뒤에 붙임
intro_duration: 2              # 인트로 길이(초)
outro_duration: 2              # 아웃트로 길이(초)
outro_text: "구독과 좋아요 부탁드립니다!"

# ── 참고: 아래 항목은 이 파일이 아니라 CLI 플래그/환경변수로 제어한다 ──
# 쇼츠 수 / 언어 / 구간 길이:
#   run_pipeline.py --count 10 --lang ko
#   select_highlights.py --min-duration 15 --max-duration 60
# 봇 감지 우회 (환경변수로만):
#   export YT_COOKIE_BROWSER=chrome
#   export YT_PROXY=socks5://127.0.0.1:1080
# 임시 구간 파일은 tempfile로 항상 자동 삭제된다 (별도 설정 없음)
